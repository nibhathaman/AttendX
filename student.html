<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AttendX - Student</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>AttendX</h1>
        <p>Student Portal</p>
    </header>

    <main>
        <section class="hero">

            <h2>Mark Attendance</h2>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >

            <br><br>

            <input
                type="text"
                id="studentRoll"
                placeholder="Enter roll number"
            >

            <br><br>

            <input
                type="password"
                id="studentPassword"
                placeholder="Enter password"
            >

            <br><br>

            <button
                id="scanButton"
                onclick="startStudentScanner()"
            >
                Scan QR Code
            </button>

            <br><br>

            <div id="scannerSection" style="display:none;">

                <h3>Scan Attendance QR</h3>

                <div
                    id="reader"
                    style="width:300px; max-width:100%; margin:auto;">
                </div>

                <p id="scanMessage"></p>

            </div>

        </section>
    </main>

    <script>
        // -----------------------------
        // SUPABASE CONFIGURATION
        // -----------------------------

        const supabaseClient = window.supabase.createClient(
            "https://drmhmtjhubswubvlkqvq.supabase.co",
            "sb_publishable_xCMcL-qx6NDx7UWW1Dbvmw_j0pk29nP"
        );

        // -----------------------------
        // STATE LOCKS
        // -----------------------------

        let scanner = null;
        let scannerStarting = false;
        let scanProcessing = false;

        // -----------------------------
        // LOAD LOCKED STUDENT
        // -----------------------------

        
        const lockedStudent = JSON.parse(
            localStorage.getItem("lockedStudent")
        );
        
        if (lockedStudent) {
            document.getElementById("studentName").value =
                lockedStudent.name || "";
        
            document.getElementById("studentRoll").value =
                lockedStudent.rollNumber || "";
        
            document.getElementById("studentPassword").value =
                lockedStudent.password || "";
        
            document.getElementById("studentName").readOnly = true;
            document.getElementById("studentRoll").readOnly = true;
            document.getElementById("studentPassword").readOnly = true;
        }


        // -----------------------------
        // START STUDENT QR SCANNER
        // -----------------------------

        async function startStudentScanner() {

            if (scannerStarting || scanProcessing) {
                return;
            }

            const name =
                document.getElementById("studentName").value.trim();

            const roll =
                document.getElementById("studentRoll").value.trim();

            const password =
                document.getElementById("studentPassword").value.trim();

            if (!name || !roll || !password) {
                alert("Please enter your name, roll number and password.");
                return;
            }

            localStorage.setItem("studentName", name);
            localStorage.setItem("studentRoll", roll);

            document.getElementById("scannerSection").style.display = "block";
            document.getElementById("scanButton").disabled = true;
            document.getElementById("scanMessage").innerText =
                "Starting camera...";

            scannerStarting = true;

            try {
                scanner = new Html5Qrcode("reader");

                await scanner.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },

                    async function(decodedText) {

                        // Block repeated QR callbacks.
                        if (scanProcessing) {
                            return;
                        }

                        scanProcessing = true;

                        try {
                            await scanner.stop();
                            await handleScannedQR(decodedText);
                        } catch (error) {
                            console.error("Scanner processing error:", error);

                            document.getElementById("scanMessage").innerText =
                                "Could not process the QR code. Reload the page to try again.";
                        }
                    },

                    function(errorMessage) {
                        // Normal scanner misses are ignored.
                    }
                );

                document.getElementById("scanMessage").innerText =
                    "Camera ready. Scan the attendance QR code.";

            } catch (error) {
                console.error("Camera start error:", error);

                document.getElementById("scanMessage").innerText =
                    "Camera could not be opened. Please allow camera permission.";

                document.getElementById("scanButton").disabled = false;
                scanner = null;
            } finally {
                scannerStarting = false;
            }
        }

        // -----------------------------
        // HANDLE SCANNED QR
        // -----------------------------

        async function handleScannedQR(decodedText) {

            const name = localStorage.getItem("studentName");
            const roll = localStorage.getItem("studentRoll");

            try {
                const qrURL = new URL(decodedText);
                const sessionId = qrURL.searchParams.get("session");

                if (!sessionId || !name || !roll) {
                    document.getElementById("scanMessage").innerText =
                        "Invalid QR code or missing student information.";
                    return;
                }

                // Validate that this is an AttendX QR URL.
                if (
                    qrURL.protocol !== "https:" ||
                    qrURL.hostname !== "nibhathaman.github.io" ||
                    !qrURL.pathname.toLowerCase().includes("attendx")
                ) {
                    document.getElementById("scanMessage").innerText =
                        "Invalid QR code. Please scan the AttendX QR code.";
                    return;
                }

                localStorage.setItem("scannedSessionId", sessionId);

                const saved = await saveAttendanceToSupabase(
                    name,
                    roll,
                    sessionId
                );

                if (!saved) {
                    return;
                }

                document.getElementById("scanMessage").innerText =
                    "QR scanned successfully!";

                window.location.href = "attendance-success.html";

            } catch (error) {
                console.error("QR handling error:", error);

                document.getElementById("scanMessage").innerText =
                    "Invalid QR code. Please scan the AttendX QR code.";
            }
        }

        // -----------------------------
        // CHECK AND SAVE ATTENDANCE
        // -----------------------------

        async function saveAttendanceToSupabase(
            name,
            roll,
            sessionId
        ) {

            try {
                // First check whether attendance already exists.
                const { data, error: checkError } = await supabaseClient
                    .from("attendance")
                    .select("id")
                    .eq("roll_number", roll)
                    .eq("session_id", sessionId)
                    .limit(1);

                if (checkError) {
                    alert(JSON.stringify(checkError, null, 2));
                    console.error("Duplicate check failed:", checkError);
                    return false;
                }

                if (data && data.length > 0) {
                    alert(
                        "Attendance has already been marked for this session."
                    );

                    return false;
                }

                // Insert only after the check succeeds.
                const { error: insertError } = await supabaseClient
                    .from("attendance")
                    .insert([
                        {
                            name: name,
                            roll_number: roll,
                            status: "Present",
                            session_id: sessionId,
                            attendance_time: new Date().toISOString()
                        }
                    ]);

                if (insertError) {
                    console.error("Attendance insert failed:", insertError);

                    alert("SUPABASE ERROR: " + insertError.message);
                    return false;
                }

                return true;

            } catch (error) {
                console.error("Attendance save error:", error);

                alert(
                    "Could not save attendance. Please check your connection and try again."
                );

                return false;
            }
        }
    </script>

</body>

</html>

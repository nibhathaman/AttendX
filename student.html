<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>AttendX - Student</title>

    <link rel="stylesheet" href="style.css">

    <!-- QR Scanner Library -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

    <header>
        <h1>AttendX</h1>
        <p>Student Portal</p>
    </header>

    <main>
        <section class="hero">

            <h2>Mark Attendance</h2>

            <input
                type="text"
                id="studentName"
                placeholder="Enter your name"
            >

            <br><br>

            <input
                type="text"
                id="studentRoll"
                placeholder="Enter roll number"
            >

            <br><br>

            <input
                type="password"
                id="studentPassword"
                placeholder="Enter password"
            >

            <br><br>

            <button onclick="startStudentScanner()">
                Scan QR Code
            </button>

            <br><br>

            <div id="scannerSection" style="display:none;">

                <h3>Scan Attendance QR</h3>

                <div
                    id="reader"
                    style="width:300px; max-width:100%; margin:auto;">
                </div>

                <p id="scanMessage"></p>

            </div>

        </section>
    </main>


    <script>

        // -----------------------------
        // LOAD LOCKED STUDENT
        // -----------------------------

        const lockedStudent =
            JSON.parse(
                localStorage.getItem("lockedStudent")
            );

        if (lockedStudent) {

            document.getElementById("studentName").value =
                lockedStudent.name;

            document.getElementById("studentRoll").value =
                lockedStudent.rollNumber;

            document.getElementById("studentPassword").value =
                lockedStudent.password;

            document.getElementById("studentName").readOnly = true;
            document.getElementById("studentRoll").readOnly = true;
            document.getElementById("studentPassword").readOnly = true;
        }


        // -----------------------------
        // START STUDENT QR SCANNER
        // -----------------------------

        function startStudentScanner() {

            const name =
                document.getElementById("studentName").value.trim();

            const roll =
                document.getElementById("studentRoll").value.trim();

            const password =
                document.getElementById("studentPassword").value.trim();


            if (
                name === "" ||
                roll === "" ||
                password === ""
            ) {

                alert(
                    "Please enter your name, roll number and password."
                );

                return;
            }


            // Save student information

            localStorage.setItem(
                "studentName",
                name
            );

            localStorage.setItem(
                "studentRoll",
                roll
            );


            // Show scanner

            document.getElementById(
                "scannerSection"
            ).style.display = "block";


            const scanner =
                new Html5Qrcode("reader");


            scanner.start(

                {
                    facingMode: "environment"
                },

                {
                    fps: 10,
                    qrbox: 250
                },

                function(decodedText) {

                    scanner.stop();

                    handleScannedQR(decodedText);

                },

                function(errorMessage) {

                    // Scanner keeps looking for QR

                }

            )

            .catch(function(error) {

                document.getElementById(
                    "scanMessage"
                ).innerText =
                    "Camera could not be opened. Please allow camera permission.";

            });

        }

        
        // -----------------------------
        // HANDLE SCANNED QR
        // -----------------------------
        async function saveAttendanceToSupabase(
            name,
            roll,
            sessionId
        ) {
            const { error } = await supabaseClient
                .from("attendance")
                .insert([
                    {
                        name: name,
                        roll_number: roll,
                        status: "Present",
                        session_id: sessionId,
                        attendance_time: new Date().toLocaleString()
                    }
                ]);

            if (error) {
                console.error(error);
                alert("SUPABASE ERROR: " + JSON.stringify(error));
                return false;
            }

            return true;
        }
        async function handleScannedQR(decodedText) {
            const name =
                localStorage.getItem("studentName");

            const roll =
                localStorage.getItem("studentRoll");
            try {

                const qrURL =
                    new URL(decodedText);


                const sessionId =
                    qrURL.searchParams.get("session");


                if (!sessionId) {

                    alert(
                        "Invalid attendance QR code."
                    );

                    return;
                }


                // Save scanned session

                localStorage.setItem(
                    "scannedSessionId",
                    sessionId
                );
                const saved =
                    await saveAttendanceToSupabase(
                        name,
                        roll,
                        sessionId
                    );

                if (!saved) {
                    return;
                }

                document.getElementById(
                    "scanMessage"
                ).innerText =
                    "QR scanned successfully!";


                // Go to attendance processing page

                window.location.href =
                    "attendance-success.html";

            }

            catch (error) {

                alert(
                    "Invalid QR code. Please scan the AttendX QR code."
                );

            }

        }
        const supabaseClient = window.supabase.createClient(
        "https://drmhmtjhubswubvlkqvq.supabase.co",
        "YOUR_PUBLISHABLE_KEY"
    );    

    </script>


</body>

</html>

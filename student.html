<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AttendX - Student Portal</title>

    <!-- QR Scanner -->
    <script src="https://unpkg.com/html5-qrcode"></script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f7fa;
            color: #222;
            text-align: center;
        }

        header {
            background: #1f2937;
            color: white;
            padding: 20px;
        }

        header h1 {
            margin: 0;
        }

        .container {
            max-width: 500px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 8px;
        }

        input {
            width: 90%;
            padding: 12px;
            margin: 8px;
            box-sizing: border-box;
        }

        button {
            padding: 12px 25px;
            margin: 15px;
            background: #1f2937;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        #scannerSection {
            margin-top: 25px;
        }

        #reader {
            width: 100%;
            max-width: 350px;
            margin: auto;
        }

        #scanMessage {
            margin-top: 15px;
            font-weight: bold;
        }

    </style>

</head>


<body>

    <header>

        <h1>AttendX</h1>

        <p>Student Portal</p>

    </header>


    <div class="container">

        <h2>Student Attendance</h2>


        <input
            type="text"
            id="studentName"
            placeholder="Enter Name"
        >


        <input
            type="text"
            id="studentRoll"
            placeholder="Enter Roll Number"
        >


        <input
            type="password"
            id="studentPassword"
            placeholder="Enter Password"
        >


        <br>


        <button onclick="startStudentScanner()">
            Start Scanner
        </button>


        <div id="scannerSection" style="display:none;">

            <h3>Scan Attendance QR</h3>

            <div id="reader"></div>

            <p id="scanMessage"></p>

        </div>

    </div>


    <script>

        // --------------------------------
        // SUPABASE CONNECTION
        // --------------------------------

        const supabaseClient =
            window.supabase.createClient(

                "https://drmhmtjhubswubvlkqvq.supabase.co",


            );


        // --------------------------------
        // START STUDENT SCANNER
        // --------------------------------

        function startStudentScanner() {

            const name =
                document
                    .getElementById("studentName")
                    .value
                    .trim();


            const roll =
                document
                    .getElementById("studentRoll")
                    .value
                    .trim();


            if (name === "" || roll === "") {

                alert(
                    "Please enter your name and roll number."
                );

                return;

            }


            // --------------------------------
            // DEVICE CREDENTIAL LOCK
            // --------------------------------

            const savedName =
                localStorage.getItem(
                    "lockedStudentName"
                );


            const savedRoll =
                localStorage.getItem(
                    "lockedStudentRoll"
                );


            // First time on this device/browser
            if (!savedName && !savedRoll) {

                localStorage.setItem(
                    "lockedStudentName",
                    name
                );

                localStorage.setItem(
                    "lockedStudentRoll",
                    roll
                );

            }

            // Device is already locked
            else {

                if (
                    savedName !== name ||
                    savedRoll !== roll
                ) {

                    alert(
                        "This device is already registered to another student. You cannot use different credentials on this device."
                    );

                    return;

                }

            }


            // Save current student information

            localStorage.setItem(
                "studentName",
                name
            );

            localStorage.setItem(
                "studentRoll",
                roll
            );


            document.getElementById(
                "scannerSection"
            ).style.display = "block";


            const html5QrCode =
                new Html5Qrcode("reader");


            html5QrCode.start(

                { facingMode: "environment" },

                {
                    fps: 10,
                    qrbox: 250
                },

                async function(decodedText) {

                    await handleScannedQR(
                        decodedText
                    );

                    html5QrCode.stop();

                },

                function(errorMessage) {

                    // Scanner continuously checks QR.
                    // No action needed here.

                }

            ).catch(function(error) {

                document.getElementById(
                    "scanMessage"
                ).innerText =
                    "Camera could not be opened. Please allow camera permission.";

            });

        }


        // --------------------------------
        // SAVE ATTENDANCE TO SUPABASE
        // --------------------------------

        async function saveAttendanceToSupabase(
            name,
            roll,
            sessionId
        ) {

            const { error } =
                await supabaseClient
                    .from("attendance")
                    .insert([
                        {
                            name: name,
                            roll_number: roll,
                            status: "Present",
                            session_id: sessionId,
                            attendance_time:
                                new Date().toLocaleString()
                        }
                    ]);


            if (error) {

                console.error(error);

                alert(
                    "SUPABASE ERROR: " +
                    error.message
                );

                return false;

            }


            return true;

        }


        // --------------------------------
        // HANDLE SCANNED QR
        // --------------------------------

        async function handleScannedQR(
            decodedText
        ) {

            try {

                const name =
                    localStorage.getItem(
                        "studentName"
                    );


                const roll =
                    localStorage.getItem(
                        "studentRoll"
                    );


                const qrURL =
                    new URL(decodedText);


                const sessionId =
                    qrURL.searchParams.get(
                        "session"
                    );


                if (!sessionId) {

                    alert(
                        "Invalid QR code. Please scan the AttendX QR code."
                    );

                    return;

                }


                localStorage.setItem(
                    "scannedSessionId",
                    sessionId
                );


                const saved =
                    await saveAttendanceToSupabase(
                        name,
                        roll,
                        sessionId
                    );


                if (!saved) {

                    return;

                }


                window.location.href =
                    "attendance-success.html";

            }

            catch (error) {

                console.error(error);

                alert(
                    "Invalid QR code. Please scan the AttendX QR code."
                );

            }

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AttendX - Teacher Dashboard</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <header>

        <h1>AttendX</h1>

        <p>Teacher Dashboard</p>

    </header>


    <main>

        <section class="hero">

            <h2>Welcome, Teacher</h2>

            <p>
                Create and manage your attendance session.
            </p>

            <br>


            <!-- CURRENT SESSION INFORMATION -->

            <div id="dashboardSession">

                <h3>Current Session</h3>

                <p>
                    <strong>Session ID:</strong>
                    <span id="dashboardSessionId">
                        No session
                    </span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="dashboardSessionStatus">
                        Inactive
                    </span>
                </p>

                <p>
                    <strong>Students Present:</strong>
                    <span id="dashboardTotalPresent">
                        0
                    </span>
                </p>

            </div>


            <br>


            <!-- TEACHER ACTIONS -->

            <button onclick="createSession()">
                Create Attendance Session
            </button>

            <button onclick="
                const session = JSON.parse(
                    localStorage.getItem('attendanceSession')
                );

                if (!session) {
                    alert('No attendance session found.');
                } else {
                    window.location.href =
                        'attendance.html?session=' +
                        encodeURIComponent(session.sessionId);
                }
            ">
                View Attendance
            </button>

            <button onclick="endSession()">
                End Attendance Session
            </button>

        </section>

    </main>


    <script src="script.js"></script>


    <!-- DASHBOARD SESSION AND ATTENDANCE COUNT -->

    <script>

        window.onload = async function () {

            const session =
                JSON.parse(
                    localStorage.getItem("attendanceSession")
                );


            if (!session) {
                return;
            }


            document.getElementById(
                "dashboardSessionId"
            ).textContent =
                session.sessionId;


            document.getElementById(
                "dashboardSessionStatus"
            ).textContent =
                session.status;


            try {

                const response =
                    await fetch(
                        SUPABASE_URL +
                        "/rest/v1/attendance" +
                        "?select=id" +
                        "&session_id=eq." +
                        encodeURIComponent(
                            session.sessionId
                        ),
                        {
                            method: "GET",

                            headers: {
                                "apikey":
                                    SUPABASE_KEY,

                                "Authorization":
                                    "Bearer " +
                                    SUPABASE_KEY
                            }
                        }
                    );


                if (!response.ok) {

                    console.error(
                        "Could not fetch attendance count."
                    );

                    return;
                }


                const data =
                    await response.json();


                document.getElementById(
                    "dashboardTotalPresent"
                ).textContent =
                    data.length;


            } catch (error) {

                console.error(
                    "Attendance count error:",
                    error
                );

            }

        };

    </script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AttendX - Attendance Records</title>

    <link rel="stylesheet"
        href="style.css">

</head>

<body>

    <header>

        <h1>AttendX</h1>

        <p>Attendance Records</p>

    </header>


    <main>

        <section class="hero">

            <h2>Attendance Dashboard</h2>


            <div id="sessionInfo">

                <p>
                    <strong>Session ID:</strong>
                    <span id="sessionId">
                        Loading...
                    </span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="sessionStatus">
                        Loading...
                    </span>
                </p>

                <p>
                    <strong>Total Students Present:</strong>
                    <span id="totalPresent">
                        0
                    </span>
                </p>

            </div>


            <br>


            <h3>Attendance Records</h3>
            <button onclick="downloadAttendanceReport()">
             Download Attendance Report
            </button>


            <div id="attendanceList">

                <p>
                    No attendance records yet.
                </p>

            </div>

        </section>

    </main>


    <script src="script.js"></script>

</body>

</html>

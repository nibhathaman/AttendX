<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AttendX - Attendance Records</title>

    <link rel="stylesheet"
        href="style.css">

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <header>

        <h1>AttendX</h1>

        <p>Attendance Records</p>

    </header>


    <main>

        <section class="hero">

            <h2>Attendance Records</h2>

            <br>


            <!-- SESSION INFORMATION -->

            <div id="attendanceSession">

                <p>
                    <strong>Session ID:</strong>
                    <span id="sessionId">
                        Loading...
                    </span>
                </p>

                <p>
                    <strong>Status:</strong>
                    <span id="sessionStatus">
                        Loading...
                    </span>
                </p>

                <p>
                    <strong>Students Present:</strong>
                    <span id="totalPresent">
                        0
                    </span>
                </p>

            </div>


            <br>


            <!-- ATTENDANCE LIST -->

            <div id="attendanceList">

                <p>
                    Loading attendance records...
                </p>

            </div>


            <br>


            <!-- DOWNLOAD REPORT -->

            <button onclick="downloadAttendanceReport()">
                Download Attendance Report
            </button>


            <br>
            <br>


            <button onclick="goHome()">
                Back to Home
            </button>

        </section>

    </main>


    <script>

        const attendanceSupabase =
            window.supabase.createClient(
                "https://drmhmtjhubswubvlkqvq.supabase.co",
                "sb_publishable_xCMcL-qx6NDx7UWW1Dbvmw_j0pk29nP"
            );


        // --------------------------------
        // LOAD ATTENDANCE
        // --------------------------------

        async function loadAttendanceFromSupabase() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            // IMPORTANT:
            // Get session ID from View Attendance URL

            const sessionId =
                urlParams.get("session");


            if (!sessionId) {

                document.getElementById(
                    "sessionId"
                ).innerText =
                    "No session found";


                document.getElementById(
                    "sessionStatus"
                ).innerText =
                    "No session found";


                document.getElementById(
                    "attendanceList"
                ).innerHTML =
                    "<p>No attendance session found.</p>";


                return;
            }


            // Display EXACT session ID

            document.getElementById(
                "sessionId"
            ).innerText =
                sessionId;


            // --------------------------------
            // SESSION STATUS
            // --------------------------------

            const storedSession =
                JSON.parse(
                    localStorage.getItem(
                        "attendanceSession"
                    )
                );


            if (
                storedSession &&
                storedSession.sessionId === sessionId
            ) {

                document.getElementById(
                    "sessionStatus"
                ).innerText =
                    storedSession.status;

            }

            else {

                document.getElementById(
                    "sessionStatus"
                ).innerText =
                    "Active";

            }


            // --------------------------------
            // GET RECORDS FROM SUPABASE
            // --------------------------------

            const { data, error } =
                await attendanceSupabase
                    .from("attendance")
                    .select("*")
                    .eq(
                        "session_id",
                        sessionId
                    );


            if (error) {

                console.error(
                    "Supabase Error:",
                    error
                );


                document.getElementById(
                    "attendanceList"
                ).innerHTML =
                    "<p>Error loading attendance records.</p>";


                alert(
                    "SUPABASE ERROR: " +
                    error.message
                );


                return;
            }


            // --------------------------------
            // TOTAL PRESENT
            // --------------------------------

            document.getElementById(
                "totalPresent"
            ).innerText =
                data.length;


            const attendanceList =
                document.getElementById(
                    "attendanceList"
                );


            // --------------------------------
            // NO RECORDS
            // --------------------------------

            if (data.length === 0) {

                attendanceList.innerHTML =
                    "<p>No attendance records yet.</p>";

                return;
            }


            // --------------------------------
            // DISPLAY RECORDS
            // --------------------------------

            attendanceList.innerHTML = "";


            data.forEach(
                function(record, index) {

                    const recordDiv =
                        document.createElement(
                            "div"
                        );


                    recordDiv.innerHTML = `

                        <p>

                            <strong>
                                ${index + 1}.
                            </strong>

                            ${record.name}

                            |

                            ${record.roll_number}

                            |

                            ${record.status}

                            |

                            ${record.attendance_time}

                        </p>

                    `;


                    attendanceList.appendChild(
                        recordDiv
                    );

                }
            );

        }


        // --------------------------------
        // DOWNLOAD REPORT
        // --------------------------------

        async function downloadAttendanceReport() {

            const urlParams =
                new URLSearchParams(
                    window.location.search
                );


            const sessionId =
                urlParams.get("session");


            if (!sessionId) {

                alert(
                    "No attendance session found."
                );

                return;
            }


            try {

                const { data, error } =
                    await attendanceSupabase
                        .from("attendance")
                        .select("*")
                        .eq(
                            "session_id",
                            sessionId
                        );


                if (error) {

                    console.error(
                        "Supabase Error:",
                        error
                    );


                    alert(
                        "Could not load attendance records."
                    );


                    return;
                }


                if (
                    !data ||
                    data.length === 0
                ) {

                    alert(
                        "No attendance records available for this session."
                    );


                    return;
                }


                let csv =
                    "Name,Roll Number,Status,Session ID,Time\n";


                data.forEach(
                    function(record) {

                        csv +=
                            `"${record.name}",` +
                            `"${record.roll_number}",` +
                            `"${record.status}",` +
                            `"${record.session_id}",` +
                            `"${record.attendance_time}"\n`;

                    }
                );


                const blob =
                    new Blob(
                        [csv],
                        {
                            type:
                                "text/csv;charset=utf-8;"
                        }
                    );


                const url =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    url;


                link.download =
                    "AttendX_Attendance_Report.csv";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                URL.revokeObjectURL(
                    url
                );

            }

            catch (error) {

                console.error(
                    error
                );


                alert(
                    "Could not download attendance report."
                );

            }

        }


        // --------------------------------
        // GO HOME
        // --------------------------------

        function goHome() {

            window.location.href =
                "index.html";

        }


        // --------------------------------
        // START
        // --------------------------------

        loadAttendanceFromSupabase();

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>AttendX - Attendance Records</title>

    <link rel="stylesheet"
        href="style.css">

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

</head>

<body>

    <header>

        <h1>AttendX</h1>

        <p>Attendance Records</p>

    </header>


    <main>

        <section class="hero">

            <h2>Attendance Dashboard</h2>


            <div id="sessionInfo">

                <p>
                    <strong>Session ID:</strong>
                    <span id="sessionId">
                        Loading...
                    </span>
                </p>


                <p>
                    <strong>Status:</strong>
                    <span id="sessionStatus">
                        Loading...
                    </span>
                </p>


                <p>
                    <strong>Total Students Present:</strong>
                    <span id="totalPresent">
                        0
                    </span>
                </p>

            </div>


            <br>


            <h3>Attendance Records</h3>


            <button onclick="downloadAttendanceReport()">
                Download Attendance Report
            </button>


            <div id="attendanceList">

                <p>
                    Loading attendance records...
                </p>

            </div>

        </section>

    </main>


    <script>

        // --------------------------------
        // SUPABASE CONNECTION
        // --------------------------------

        const attendanceSupabase =
            window.supabase.createClient(
                "https://drmhmtjhubswubvlkqvq.supabase.co",
                "sb_publishable_xCMcL-qx6NDx7UWW1Dbvmw_j0pk29nP"
            );


        // --------------------------------
        // GET SESSION FROM URL
        // --------------------------------

        const urlParams =
            new URLSearchParams(
                window.location.search
            );


        const currentSessionId =
            urlParams.get("session");


        // --------------------------------
        // LOAD ATTENDANCE
        // --------------------------------

        async function loadAttendanceFromSupabase() {

            if (!currentSessionId) {

                document.getElementById("sessionId").innerText =
                    "No session found";

                document.getElementById("sessionStatus").innerText =
                    "Inactive";

                document.getElementById("attendanceList").innerHTML =
                    "<p>No attendance session found.</p>";

                return;
            }


            // Show the EXACT session ID received from dashboard

            document.getElementById("sessionId").innerText =
                currentSessionId;


            // Get status from existing local session

            const storedSession =
                JSON.parse(
                    localStorage.getItem(
                        "attendanceSession"
                    )
                );


            if (
                storedSession &&
                storedSession.sessionId === currentSessionId
            ) {

                document.getElementById(
                    "sessionStatus"
                ).innerText =
                    storedSession.status;

            }

            else {

                document.getElementById(
                    "sessionStatus"
                ).innerText =
                    "Active";

            }


            // --------------------------------
            // FETCH RECORDS FROM SUPABASE
            // --------------------------------

            const { data, error } =
                await attendanceSupabase
                    .from("attendance")
                    .select("*")
                    .eq(
                        "session_id",
                        currentSessionId
                    );


            if (error) {

                console.error(error);

                document.getElementById(
                    "attendanceList"
                ).innerHTML =
                    "<p>Error loading attendance records.</p>";

                alert(
                    "SUPABASE ERROR: " +
                    error.message
                );

                return;
            }


            document.getElementById(
                "totalPresent"
            ).innerText =
                data.length;


            const attendanceList =
                document.getElementById(
                    "attendanceList"
                );


            if (data.length === 0) {

                attendanceList.innerHTML =
                    "<p>No attendance records yet.</p>";

                return;
            }


            attendanceList.innerHTML = "";


            data.forEach(
                function(record, index) {

                    const recordDiv =
                        document.createElement(
                            "div"
                        );


                    recordDiv.innerHTML = `
                        <p>
                            <strong>${index + 1}.</strong>
                            ${record.name}
                            |
                            ${record.roll_number}
                            |
                            ${record.status}
                            |
                            ${record.attendance_time}
                        </p>
                    `;


                    attendanceList.appendChild(
                        recordDiv
                    );

                }
            );

        }


        // --------------------------------
        // DOWNLOAD ATTENDANCE REPORT
        // --------------------------------

        async function downloadAttendanceReport() {

            if (!currentSessionId) {

                alert(
                    "No attendance session found."
                );

                return;
            }


            try {

                const { data, error } =
                    await attendanceSupabase
                        .from("attendance")
                        .select("*")
                        .eq(
                            "session_id",
                            currentSessionId
                        );


                if (error) {

                    alert(
                        "Could not load attendance records."
                    );

                    return;
                }


                if (!data || data.length === 0) {

                    alert(
                        "No attendance records available for this session."
                    );

                    return;
                }


                let csv =
                    "Name,Roll Number,Status,Session ID,Time\n";


                data.forEach(
                    function(record) {

                        csv +=
                            `"${record.name}",` +
                            `"${record.roll_number}",` +
                            `"${record.status}",` +
                            `"${record.session_id}",` +
                            `"${record.attendance_time}"\n`;

                    }
                );


                const blob =
                    new Blob(
                        [csv],
                        {
                            type:
                                "text/csv;charset=utf-8;"
                        }
                    );


                const urlObject =
                    URL.createObjectURL(
                        blob
                    );


                const link =
                    document.createElement(
                        "a"
                    );


                link.href =
                    urlObject;


                link.download =
                    "AttendX_Attendance_Report.csv";


                document.body.appendChild(
                    link
                );


                link.click();


                document.body.removeChild(
                    link
                );


                URL.revokeObjectURL(
                    urlObject
                );

            }

            catch (error) {

                console.error(error);

                alert(
                    "Could not download attendance report."
                );

            }

        }


        // --------------------------------
        // LOAD PAGE
        // --------------------------------

        loadAttendanceFromSupabase();

    </script>

</body>

</html>
